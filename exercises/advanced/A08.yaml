id: A08
level: advanced
title: 急な集中（スパイク）
scenario: ふだんは少ない利用者が，数秒で一気に何倍にも増える状況を作りたい
minutes: 8
optional: true
type: code
doc:
  - https://grafana.com/docs/k6/latest/testing-guides/test-types/spike-testing/
statement: |
  ## 状況

  ふだんは5人ほどしか使わない一覧ページが，テレビで紹介された直後に **数秒で50人以上** に増える．急に人が増えたときにエラーが増えないか，一覧の応答が遅くならないかを確かめたい（**スパイクテスト**）．いまのコードは最初から最後まで 50 VU のままで，「急に増える」を表せていない．

  ## やること

  1. `stages` で，ふだんの負荷（5 VU ほど）から **10秒以内に 50 VU 以上** へ一気に上げ，しばらく保ってから下げ，最後は 0 VU で終える
  2. 失敗の割合の閾値 `http_req_failed` を置く
  3. 一覧 `/api/items` だけを測る応答時間の閾値を置く

  ## 書き方の型

  急に上げる段は，「短い `duration` で大きな `target`」にします．

  ```
  { duration: '10s', target: 5 },   // ふだん
  { duration: '5s', target: 50 },   // 急に増える
  ```
starter: |
  import http from 'k6/http';
  import { check, sleep } from 'k6';

  const BASE_URL = __ENV.BASE_URL;

  export const options = {
    vus: 50,
    duration: '40s',
  };

  export default function () {
    const res = http.get(`${BASE_URL}/api/items`);
    check(res, { 'items 200': (r) => r.status === 200 });
    sleep(1);
  }
solution: |
  import http from 'k6/http';
  import { check, sleep } from 'k6';

  const BASE_URL = __ENV.BASE_URL;

  export const options = {
    stages: [
      { duration: '10s', target: 5 },  // ふだん
      { duration: '5s', target: 50 },  // 急に増える
      { duration: '20s', target: 50 }, // 集中が続く
      { duration: '5s', target: 5 },   // 引いていく
      { duration: '5s', target: 0 },
    ],
    thresholds: {
      http_req_failed: ['rate<0.01'],
      'http_req_duration{name:items}': ['p(95)<500'],
    },
  };

  export default function () {
    const res = http.get(`${BASE_URL}/api/items`, { tags: { name: 'items' } });
    check(res, { 'items 200': (r) => r.status === 200 });
    sleep(1);
  }
judge:
  static:
    spike:
      min_target: 50
      max_ramp: 10s
    stages_end_at_zero: true
    max_vus: 100
    thresholds:
      - metric: http_req_failed
      - for_path: /api/items
  run:
    exit_code: 0
hints:
  - when: { fail: spike }
    text: "5 VU ほどの段のあとに，`{ duration: '5s', target: 50 }` のような短くて大きい段を置こう．0 からいきなり始めるのではなく，ふだんの負荷から急に増えるのがスパイクです．"
  - when: { fail: thresholds }
    text: "`http_req_failed: ['rate<0.01']` と，`/api/items` にタグを付けた `'http_req_duration{name:items}'` の閾値を置こう．"
explanation: |
  スパイクテストは「急な集中に耐えられるか」を見るテストです．ゆっくり上げる負荷（B03）では問題が出なくても，急に増えると接続の受け付けや順番待ちが追いつかず，エラーや遅延が出ることがあります．

  - ふだん → 急増 → 集中が続く → 引く，の段で書く
  - 急増の段は `duration` を短く，`target` を大きく
  - エラーの割合（`http_req_failed`）を必ず見る

  参照：https://grafana.com/docs/k6/latest/testing-guides/test-types/spike-testing/
tips:
  - title: 段の流れ
    text: |
      ふだん（5 VU）→ 急に増える（短い時間で 50 VU）→ 集中が続く → 引いていく → 0 VU，の5段で書きます．
      急に増える段は `duration` を短く（例：`'5s'`）します．
  - title: stages の例
    text: |
      ```
      stages: [
        { duration: '10s', target: 5 },
        { duration: '5s', target: 50 },
        { duration: '20s', target: 50 },
        { duration: '5s', target: 5 },
        { duration: '5s', target: 0 },
      ],
      ```
      `vus` と `duration` は消します．
  - title: 閾値
    text: |
      一覧のリクエストに `{ tags: { name: 'items' } }` を付けて，次の2つを置きます．
      ```
      thresholds: {
        http_req_failed: ['rate<0.01'],
        'http_req_duration{name:items}': ['p(95)<500'],
      },
      ```
