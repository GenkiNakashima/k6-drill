id: A01
level: advanced
title: エンドポイント別の閾値
scenario: 速いリクエストが大半で，遅いエンドポイントが少しだけあるとき，その遅さを見逃さないようにしたい
minutes: 10
type: code
statement: |
  ## 状況

  利用者は一覧 `/api/items` を30回見たあと，重い処理 `/api/heavy` を1回呼ぶ．閾値は `http_req_duration: ['p(95)<1000']` の1つだけ．

  `/api/heavy` は同時に1件しか処理しないので，20 VU では順番待ちで1回あたり数秒かかる．しかし `/api/heavy` は全リクエストの約3% しかなく，全体の p(95)（速い順に並べて95% の位置）には現れない．このテストは k6 で実行すると **合格してしまう**．

  ## やること

  `/api/heavy` の遅さを検出できるテストにしてください．

  - `/api/heavy` のリクエストにタグを付け，**`/api/heavy` だけを測る閾値** を置く（目標は p(95) が 1000ms 未満）
  - 集約の閾値は残してかまいません．負荷のかけ方は変えないでください

  採点では，閾値の `{ }` の条件に合うリクエストをコードから探し，`/api/heavy` だけを測っているかを確かめます．
starter: |
  import http from 'k6/http';
  import { check } from 'k6';

  const BASE_URL = __ENV.BASE_URL;

  export const options = {
    vus: 20,
    duration: '20s',
    thresholds: {
      http_req_duration: ['p(95)<1000'],
    },
  };

  export default function () {
    // 一覧を30回見る
    for (let i = 0; i < 30; i++) {
      const res = http.get(`${BASE_URL}/api/items`);
      check(res, { 'items 200': (r) => r.status === 200 });
    }

    // 重い処理を1回呼ぶ
    const res = http.get(`${BASE_URL}/api/heavy`);
    check(res, { 'heavy 200': (r) => r.status === 200 });
  }
solution: |
  import http from 'k6/http';
  import { check } from 'k6';

  const BASE_URL = __ENV.BASE_URL;

  export const options = {
    vus: 20,
    duration: '20s',
    thresholds: {
      http_req_duration: ['p(95)<1000'],
      'http_req_duration{name:heavy}': ['p(95)<1000'],
    },
  };

  export default function () {
    // 一覧を30回見る
    for (let i = 0; i < 30; i++) {
      const res = http.get(`${BASE_URL}/api/items`, { tags: { name: 'items' } });
      check(res, { 'items 200': (r) => r.status === 200 });
    }

    // 重い処理を1回呼ぶ
    const res = http.get(`${BASE_URL}/api/heavy`, { tags: { name: 'heavy' } });
    check(res, { 'heavy 200': (r) => r.status === 200 });
  }
judge:
  static:
    min_vus: 20
    thresholds:
      - for_path: /api/heavy
        max_ms: 1000
    requests:
      - method: GET
        path: /api/items
        in_loop: true
      - method: GET
        path: /api/heavy
  run:
    exit_code: 99
    thresholds:
      - url_contains: /api/heavy
        ok: false
        min_count: 1
hints:
  - when: only_aggregate_threshold
    text: "少数の遅いリクエストは，上位5% の外に埋もれることがある．`/api/heavy` だけに閾値を置くには？（B08 のタグを思い出そう）"
  - when: zero_sample_threshold
    text: "閾値の `{ }` の中と，リクエストに付けたタグが1文字ずつ一致しているか確かめよう．"
  - when: { fail: thresholds }
    text: "`/api/heavy` に `{ tags: { name: 'heavy' } }` を付け，`'http_req_duration{name:heavy}': ['p(95)<1000']` を置く形が基本です．"
explanation: |
  `/api/heavy` は全リクエストの約3%（31件に1件）しかないので，集約の `p(95)` には現れません．エンドポイントごとにタグを付け，タグで絞った閾値を置くと，そのエンドポイントだけで合否を決められます．

  ```
  thresholds: {
    http_req_duration: ['p(95)<1000'],
    'http_req_duration{name:heavy}': ['p(95)<1000'],
  }
  ```

  参照：https://grafana.com/docs/k6/latest/using-k6/thresholds/ （Thresholds on tags）
tips:
  - title: なぜ合格してしまう？
    text: |
      1回の繰り返しで `/api/items` が30回，`/api/heavy` が1回なので，heavy は全体の約3% です．全体の `p(95)` は「速い順に並べて95% の位置」なので，ほぼ items の速さしか見ていません．
  - title: やることは2つ
    text: |
      1. `/api/heavy` のリクエストに名前のタグを付ける（B08）
      2. そのタグで絞った閾値を足す
  - title: 答えに近いヒント
    text: |
      ```
      const res = http.get(`${BASE_URL}/api/heavy`, { tags: { name: 'heavy' } });
      ```
      ```
      thresholds: {
        http_req_duration: ['p(95)<1000'],
        'http_req_duration{name:heavy}': ['p(95)<1000'],
      },
      ```
      `{ }` を含むキーは，`'...'` で囲みます．
